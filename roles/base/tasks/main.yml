---
# Base system setup tasks

- name: Update package repositories
  community.general.zypper:
    name: "*"
    state: latest
    update_cache: true
  tags: [base]

- name: Set hostname
  hostname:
    name: "{{ hostname }}"
  tags: [base]

- name: Add user to required groups
  user:
    name: "{{ username }}"
    groups: wheel,systemd-journal,video,audio,input
    append: yes
  tags: [base]

- name: Install system services
  community.general.zypper:
    name:
      - greetd
      - tuigreet
      - flatpak
    state: present
  tags: [base]

- name: Enable greetd system service
  systemd:
    name: greetd.service
    enabled: yes
  tags: [base]

- name: Deploy greetd configuration
  copy:
    content: |
      [terminal]
      vt = 1

      [default_session]
      command = "/usr/bin/tuigreet --time --remember --remember-session --cmd {{ default_session }}"
      user = "greeter"
    dest: /etc/greetd/config.toml
    mode: '0644'
  tags: [base] 